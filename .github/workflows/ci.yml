name: CI

on:
  push:
    branches: [ main, Modan ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MeterSystem.slnx

      - name: Build
        run: dotnet build MeterSystem.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/MeterSystem.Tests/MeterSystem.Tests.csproj -c Release --no-restore --logger "console;verbosity=minimal"
